<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">QNSI enterprise deployment patterns</title>
  <desc id="desc">Five qualified deployment patterns: QNSI Cloud, VPC-peered, private endpoint, on-premises, and air-gapped or sovereign.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101d31"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#57d6c7"/></marker>
    <style>.eyebrow{font:600 14px system-ui,sans-serif;letter-spacing:1.6px;fill:#74e3d5}.heading{font:700 25px system-ui,sans-serif;fill:#f4f8fc}.title{font:700 17px system-ui,sans-serif;fill:#eef5fb}.copy{font:400 13px system-ui,sans-serif;fill:#a9bed0}.card{fill:#0c1929;stroke:#29435a;stroke-width:1.5}.node{fill:#122b39;stroke:#43cabb;stroke-width:1.5}.line{fill:none;stroke:#57d6c7;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" class="eyebrow">DEPLOYMENT QUALIFICATION</text>
  <text x="48" y="88" class="heading">One trust model, five enterprise operating patterns</text>
  <text x="48" y="116" class="copy">Availability is topology-, tenant-, provider-, region-, custody-, and evidence-specific.</text>

  <g transform="translate(48 154)"><rect width="202" height="340" rx="16" class="card"/><text x="20" y="36" class="eyebrow">DEFAULT</text><text x="20" y="68" class="title">QNSI Cloud</text><rect x="20" y="102" width="162" height="56" rx="10" class="node"/><text x="48" y="136" class="copy">Customer estate</text><path d="M101 158V196" class="line"/><rect x="20" y="198" width="162" height="76" rx="10" class="node"/><text x="48" y="230" class="copy">Public edge</text><text x="48" y="250" class="copy">and service planes</text><text x="20" y="312" class="copy">Managed public service</text></g>
  <g transform="translate(274 154)"><rect width="202" height="340" rx="16" class="card"/><text x="20" y="36" class="eyebrow">TENANT-SCOPED</text><text x="20" y="68" class="title">VPC-peered</text><rect x="20" y="112" width="68" height="72" rx="10" class="node"/><text x="36" y="144" class="copy">Your</text><text x="34" y="164" class="copy">VPC</text><path d="M88 148H116" class="line"/><rect x="116" y="112" width="66" height="72" rx="10" class="node"/><text x="132" y="144" class="copy">QNSI</text><text x="132" y="164" class="copy">VPC</text><text x="20" y="232" class="copy">Qualified routes, DNS,</text><text x="20" y="252" class="copy">region and failover</text></g>
  <g transform="translate(500 154)"><rect width="202" height="340" rx="16" class="card"/><text x="20" y="36" class="eyebrow">TENANT-SCOPED</text><text x="20" y="68" class="title">Private endpoint</text><rect x="20" y="102" width="162" height="48" rx="10" class="node"/><text x="48" y="132" class="copy">Private workload</text><path d="M101 150V184" class="line"/><rect x="20" y="186" width="162" height="48" rx="10" class="node"/><text x="43" y="216" class="copy">Endpoint service</text><path d="M101 234V268" class="line"/><text x="20" y="306" class="copy">Provider and region</text><text x="20" y="326" class="copy">must be qualified</text></g>
  <g transform="translate(726 154)"><rect width="202" height="340" rx="16" class="card"/><text x="20" y="36" class="eyebrow">CUSTOMER ENV</text><text x="20" y="68" class="title">On-premises</text><rect x="20" y="102" width="162" height="132" rx="10" fill="#101f32" stroke="#59758b" stroke-dasharray="5 4"/><rect x="40" y="122" width="122" height="42" rx="8" class="node"/><text x="67" y="148" class="copy">QNSI ingress</text><rect x="40" y="178" width="122" height="36" rx="8" class="node"/><text x="61" y="201" class="copy">Local services</text><text x="20" y="278" class="copy">Customer networking,</text><text x="20" y="298" class="copy">custody and recovery</text></g>
  <g transform="translate(952 154)"><rect width="202" height="340" rx="16" class="card"/><text x="20" y="36" class="eyebrow">CONTRACT-SCOPED</text><text x="20" y="68" class="title">Air-gapped</text><rect x="20" y="102" width="162" height="148" rx="10" fill="#101f32" stroke="#74e3d5" stroke-dasharray="5 4"/><text x="43" y="132" class="copy">Disconnected boundary</text><rect x="42" y="154" width="118" height="60" rx="8" class="node"/><text x="68" y="180" class="copy">QNSI and</text><text x="62" y="200" class="copy">local evidence</text><text x="20" y="292" class="copy">Approved offline import,</text><text x="20" y="312" class="copy">export and recovery</text></g>
</svg>
